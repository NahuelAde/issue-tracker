# Test profile: in-memory H2, isolated from ./data. No Vaadin frontend needed.
# Excluye la autoconfig web de Vaadin (los tests de servicio no levantan servlet).
spring.autoconfigure.exclude=com.vaadin.flow.spring.SpringBootAutoConfiguration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
app.launch-browser=false