# Perfil para el build que se empaqueta con jpackage y se comparte con otras personas.
# Se activa con --spring.profiles.active=dist (pendiente: pasarlo como argumento del
# lanzador nativo cuando lleguemos al paso jpackage del plan de distribución, docs/PLAN.md §18).
# El uso diario en este equipo (spring-boot:run, arrancar-gestor.cmd) NO activa este perfil,
# así que sigue con la consola H2 disponible como hasta ahora.
spring.h2.console.enabled=false
