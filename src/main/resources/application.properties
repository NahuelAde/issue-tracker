server.port=58423
server.address=127.0.0.1

spring.application.name=issue-tracker

logging.level.org.atmosphere=warn
vaadin.allowed-packages=com.vaadin,com.nahuel.issuetracker

# Abrir el navegador al arrancar (BrowserLauncher), en desarrollo y en producción por igual.
# "vaadin.launch-browser" no sirve aquí: es una función solo de modo desarrollo.
app.launch-browser=true

# BBDD fuera del directorio de instalación/ejecución (plan de distribución, docs/PLAN.md §18):
# así una actualización del programa nunca toca los datos, y cada usuario/ordenador tiene su
# propia BBDD. ${LOCALAPPDATA} lo resuelve Spring desde las variables de entorno del SO.
spring.datasource.url=jdbc:h2:file:${LOCALAPPDATA}/IssueTracker/data/issue-tracker;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=nahuel
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
